version: '3.8'

services:
  mcp-atlassian-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-atlassian-proxy
    ports:
      - "3001:3001"
    environment:
      - HOST=0.0.0.0
      - PORT=3001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - librechat

networks:
  librechat:
    external: true